name: VM1 Duplicate Check Identity Probe
on:
  pull_request:
jobs:
  fast-pass:
    name: vm1-dup-check
    runs-on: ubuntu-latest
    steps:
      - run: echo 'VM1 fast success'
  late-fail:
    name: vm1-dup-check
