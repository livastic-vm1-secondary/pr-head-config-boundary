pull_request_rules:
  - name: BASE_CONFIG_RULE_61A4
    conditions:
      - base = main
    actions:
      comment:
        message: BASE_CONFIG_MARKER_61A4

  - name: VM1_DRAFT_MERGE_INVARIANT
    conditions:
      - title = VM1_DRAFT_MERGE_INVARIANT
      - label = vm1-draft-merge-trigger
    actions:
      merge:
        method: squash
