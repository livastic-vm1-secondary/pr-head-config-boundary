pull_request_rules:
  - name: BASE_CONFIG_RULE_61A4
    conditions:
      - base = main
    actions:
      comment:
        message: BASE_CONFIG_MARKER_61A4

  - name: VM1_UNICODE_SCOPE_IMPACT
    conditions:
      - title = VM1_UNICODE_SCOPE_BYPASS_PROBE
      - check-success = @github-actions/scope-detect
    actions:
      merge: {}

scopes:
  source:
    files:
      critical:
        include:
          - "critical/**"
