scopes:
  source:
    files:
      control-scope: {}
      treatment-scope:
        include: []

pull_request_rules:
  - name: VM1 empty include control 261006
    conditions:
      - base = main
      - author = livastic-vm1-secondary
      - title = VM1_EMPTY_INCLUDE_CONTROL_261006
      - scope = control-scope
      - check-success = @github-actions/vm1-emptyinclude-ci-gate
    actions:
      merge:
        method: merge

  - name: VM1 empty include treatment 261006
    conditions:
      - base = main
      - author = livastic-vm1-secondary
      - title = VM1_EMPTY_INCLUDE_TREATMENT_261006
      - scope = treatment-scope
      - check-success = @github-actions/vm1-emptyinclude-ci-gate
    actions:
      merge:
        method: merge

  - name: VM1_R47_automatic_requested_READ_team
    conditions:
      - author = livastic-vm1-secondary
      - base = vm1-r47-autoreq-base-261012
      - title = VM1_R47_AUTOREQ_POSITIVE_261012
    actions:
      request_reviews:
        teams:
          - vm1-r47-autoreq-read-261012

  - name: VM1_R47_automatic_Read_team_protected_merge
    conditions:
      - author = livastic-vm1-secondary
      - base = vm1-r47-autoreq-base-261012
      - title = VM1_R47_AUTOREQ_POSITIVE_261012
      - review-requested = @vm1-r47-autoreq-read-261012
      - -draft
    actions:
      merge:
        method: merge
